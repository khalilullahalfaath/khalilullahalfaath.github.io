<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kma-port-architecture-title kma-port-architecture-desc" id="kma-port-architecture-root">
        <title id="kma-port-architecture-title">Where the Python port sits</title>
        <desc id="kma-port-architecture-desc">Component diagram of the kma Python package: a MATLAB original feeds a comparison harness that checks the KMA core, which supplies operator and movement hooks, draws its fitness from the benchmark functions, and is subclassed by the binary variant.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
      #kma-port-architecture-root { --color-paper:   #ffffff;
      --color-surface: #f9f9f9;
      --color-ink:     #242424;
      --color-muted:   #6b6b6b;
      --color-border:  #e6e6e6;
      --color-accent:  #1a8917;
      --font-sans:     'IBM Plex Sans', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #kma-port-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #kma-port-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#kma-port-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="kma-port-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6b6b6b"/>
          </marker>
        </defs>

        <rect width="960" height="600" fill="#ffffff"/>

        <!-- ============ Connectors (drawn before boxes) ============ -->

        <!-- a: MATLAB original -> comparison harness -->
        <line x1="140" y1="160" x2="140" y2="210" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="146" y="182" width="56" height="14" rx="2" fill="#ffffff"/>
        <text x="152" y="193" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.06em">SOURCE</text>

        <!-- b: comparison harness -> KMA core -->
        <path d="M 240,254 H 302 Q 310,254 310,246 V 204 Q 310,196 318,196 H 380"
              fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="318" y="176" width="46" height="14" rx="2" fill="#ffffff"/>
        <text x="341" y="187" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text>

        <!-- c: fitness and tests -> KMA core -->
        <line x1="700" y1="196" x2="600" y2="196" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="620" y="176" width="60" height="14" rx="2" fill="#ffffff"/>
        <text x="650" y="187" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FITNESS</text>

        <!-- d: KMA core -> operator hooks -->
        <line x1="420" y1="250" x2="420" y2="330" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="332" y="282" width="80" height="14" rx="2" fill="#ffffff"/>
        <text x="410" y="293" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">OPERATORS</text>

        <!-- e: KMA core -> movement hooks -->
        <line x1="560" y1="250" x2="560" y2="330" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="568" y="282" width="46" height="14" rx="2" fill="#ffffff"/>
        <text x="572" y="293" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.06em">MOVES</text>

        <!-- f: KMA core -> binary variant -->
        <path d="M 600,232 H 652 Q 660,232 660,240 V 436 Q 660,444 668,444 H 700"
              fill="none" stroke="#6b6b6b" stroke-width="1" marker-end="url(#kma-port-architecture-arrow)"/>
        <rect x="584" y="310" width="68" height="14" rx="2" fill="#ffffff"/>
        <text x="648" y="321" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">SUBCLASS</text>

        <!-- ============ Nodes ============ -->

        <!-- 1. MATLAB original (external, dashed) -->
        <rect x="40" y="80" width="200" height="80" rx="6" fill="#f9f9f9"/>
        <rect x="40" y="80" width="200" height="80" rx="6" fill="#f9f9f9" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="48" y="86" width="32" height="14" rx="2" fill="none" stroke="#6b6b6b" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="64" y="96" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REF</text>
        <text x="140" y="126" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">MATLAB original</text>
        <text x="140" y="146" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">KMA2D.m · KMA3D.m</text>

        <!-- 2. Comparison harness (backend) -->
        <rect x="40" y="210" width="200" height="88" rx="6" fill="#ffffff"/>
        <rect x="40" y="210" width="200" height="88" rx="6" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
        <rect x="48" y="216" width="64" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="0.8"/>
        <text x="80" y="226" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HARNESS</text>
        <text x="140" y="252" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Comparison harness</text>
        <text x="140" y="272" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">run_kma.m · run_py.py</text>
        <text x="140" y="288" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">compare.py</text>

        <!-- 3. KMA core (focal) -->
        <rect x="380" y="140" width="220" height="110" rx="6" fill="#ffffff"/>
        <rect x="380" y="140" width="220" height="110" rx="6" fill="#ffffff" stroke="#1a8917" stroke-width="1.5"/>
        <rect x="388" y="146" width="40" height="14" rx="2" fill="none" stroke="#1a8917" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="408" y="156" fill="#1a8917" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="490" y="196" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">KMA core</text>
        <text x="490" y="218" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">run() · stage 1</text>
        <text x="490" y="234" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">stage 2</text>

        <!-- 4. Operator hooks -->
        <rect x="272" y="330" width="180" height="76" rx="6" fill="#ffffff"/>
        <rect x="272" y="330" width="180" height="76" rx="6" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
        <rect x="280" y="336" width="66" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="0.8"/>
        <text x="313" y="346" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
        <text x="362" y="368" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Operator hooks</text>
        <text x="362" y="386" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">crossover · mutation</text>
        <text x="362" y="399" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">reposition</text>

        <!-- 5. Movement hooks -->
        <rect x="468" y="330" width="170" height="76" rx="6" fill="#ffffff"/>
        <rect x="468" y="330" width="170" height="76" rx="6" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
        <rect x="476" y="336" width="38" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="0.8"/>
        <text x="495" y="346" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MOVE</text>
        <text x="553" y="368" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Movement hooks</text>
        <text x="553" y="386" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">attract · distract</text>
        <text x="553" y="399" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">mlipir</text>

        <!-- 6. Fitness and tests (store) -->
        <rect x="700" y="180" width="200" height="96" rx="6" fill="#f9f9f9"/>
        <rect x="700" y="180" width="200" height="96" rx="6" fill="#f9f9f9" stroke="#e6e6e6" stroke-width="1"/>
        <rect x="708" y="186" width="58" height="14" rx="2" fill="none" stroke="#e6e6e6" stroke-width="0.8"/>
        <text x="737" y="196" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BENCH</text>
        <text x="800" y="232" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Fitness and tests</text>
        <text x="800" y="254" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">F1-F23 · 11 tests</text>

        <!-- 7. Binary variant (consumer) -->
        <rect x="700" y="400" width="200" height="88" rx="6" fill="#ffffff"/>
        <rect x="700" y="400" width="200" height="88" rx="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
        <rect x="708" y="406" width="62" height="14" rx="2" fill="none" stroke="#6b6b6b" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="739" y="416" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VARIANT</text>
        <text x="800" y="448" fill="#242424" font-size="17" font-weight="600" font-family="'IBM Plex Sans', system-ui, sans-serif" text-anchor="middle">Binary variant</text>
        <text x="800" y="470" fill="#6b6b6b" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace" text-anchor="middle">subclasses the core</text>

        <!-- ============ Legend strip ============ -->
        <line x1="40" y1="545" x2="920" y2="545" stroke="#e6e6e6" stroke-width="0.8"/>
        <text x="40" y="566" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="556" width="14" height="10" rx="2" fill="#f9f9f9" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="142" y="566" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Sans', system-ui, sans-serif">External reference</text>

        <rect x="320" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#1a8917" stroke-width="1.5"/>
        <text x="342" y="566" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Sans', system-ui, sans-serif">Algorithm core</text>

        <rect x="520" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
        <text x="542" y="566" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Sans', system-ui, sans-serif">Hook surface</text>

        <rect x="720" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
        <text x="742" y="566" fill="#6b6b6b" font-size="12" font-family="'IBM Plex Sans', system-ui, sans-serif">Consumer</text>
      </svg>
