backend:
  name: git-gateway
  branch: main

media_folder: "static/images" # Folder for uploaded files
public_folder: "images"

collections:
  - name: "posts" # Used in routes, e.g., /admin/collections/post
    label: "Posts"
    folder: "content/posts"
    path: "{{slug}}/index"
    media_folder: "" # Images go into the same folder as the post
    public_folder: ""
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "Last Modified",
          name: "lastmod",
          widget: "datetime",
          required: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - {
          label: "Math",
          name: "math",
          widget: "boolean",
          default: false,
          hint: "Turn on for Math supports",
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: false,
        }
      - {
          label: "Image Big",
          name: "ImageBig",
          widget: "image",
          required: false,
        }
      - {
          label: "Categories",
          name: "categories",
          widget: "list",
          field: { label: "Category", name: "category", widget: "string" },
        }
      - {
          label: "Medium Link",
          name: "mediumLink",
          widget: "string",
          required: false,
        }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Write your article here",
        }

  - name: "notebook"
    label: "Notebook"
    folder: "content/notebook"
    path: "{{slug}}"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Last Modified",
          name: "lastmod",
          widget: "datetime",
          required: false,
        }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["ongoing", "completed", "failed"],
        }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          field: { label: "Tag", name: "tag", widget: "string" },
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    path: "{{slug}}"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["active", "completed", "archived"],
        }
      - {
          label: "Role",
          name: "role",
          widget: "string",
          required: false,
          hint: "e.g. Lead AI Engineer & Researcher",
        }
      - {
          label: "Period",
          name: "period",
          widget: "string",
          required: false,
          hint: "e.g. Oct 2024 – Dec 2024, or Jul 2026 - Now",
        }
      - {
          label: "Tech Stack",
          name: "tech",
          widget: "list",
          field: { label: "Tech", name: "tech", widget: "string" },
          required: false,
        }
      - {
          label: "Links",
          name: "links",
          widget: "list",
          required: false,
          fields:
            [
              { label: "Label", name: "label", widget: "string", hint: "e.g. GitHub, Demo, Paper, Kaggle" },
              { label: "URL", name: "url", widget: "string" },
            ],
        }
      - {
          label: "Short Description",
          name: "description",
          widget: "text",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "til"
    label: "Back pages: Today I learned"
    folder: "content/back-pages/til"
    path: "{{slug}}"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          field: { label: "Tag", name: "tag", widget: "string" },
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "reviews"
    label: "Back pages: Reviews"
    folder: "content/back-pages/reviews"
    path: "{{slug}}"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Type",
          name: "mediatype",
          widget: "select",
          options: ["book", "movie", "song"],
        }
      - {
          label: "Creator (author / director / artist)",
          name: "creator",
          widget: "string",
          required: false,
        }
      - {
          label: "Rating (1-5)",
          name: "rating",
          widget: "number",
          min: 1,
          max: 5,
          default: 5,
        }
      - {
          label: "Short Description",
          name: "description",
          widget: "text",
        }
      - { label: "Review", name: "body", widget: "markdown" }

  - name: "weekly"
    label: "Back pages: Weekly plans"
    folder: "content/back-pages/weekly"
    path: "{{year}}-{{month}}-{{day}}"
    create: true
    sortable_fields: ["date"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. Week of November 17, 2026" }
      - { label: "Date (Monday of the week)", name: "date", widget: "datetime" }
      - { label: "Last Modified", name: "lastmod", widget: "datetime", required: false }
      - {
          label: "Plan",
          name: "body",
          widget: "markdown",
          hint: "One task per line: '- [ ] task'. Mark done with '- [x] task'.",
        }

  - name: "gratitude"
    label: "Back pages: Gratitude"
    folder: "content/back-pages/gratitude"
    path: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Single Pages"
    files:
      - name: "reviews-index"
        label: "Reviews (page settings)"
        file: "content/back-pages/reviews/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "External Review Profiles",
              name: "external_reviews",
              widget: "list",
              required: false,
              fields:
                [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" },
                ],
            }
          - { label: "Intro Text", name: "body", widget: "markdown", required: false }

      - name: "bookshelf"
        label: "Bookshelf"
        file: "content/back-pages/bookshelf.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Books",
              name: "books",
              widget: "list",
              fields:
                [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Author", name: "author", widget: "string" },
                  {
                    label: "Status",
                    name: "status",
                    widget: "select",
                    options: ["reading", "finished", "want"],
                  },
                  { label: "Note", name: "note", widget: "text" },
                ],
            }

      - name: "fun-facts"
        label: "Fun Facts"
        file: "content/back-pages/fun-facts.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Sections",
              name: "sections",
              widget: "list",
              fields:
                [
                  { label: "Title", name: "title", widget: "string" },
                  {
                    label: "Type",
                    name: "type",
                    widget: "select",
                    options: ["ranked", "bullet", "text"],
                  },
                  {
                    label: "Items (for ranked/bullet types)",
                    name: "items",
                    widget: "list",
                    required: false,
                    fields:
                      [
                        { label: "Title", name: "title", widget: "string" },
                        {
                          label: "Description",
                          name: "desc",
                          widget: "string",
                          required: false,
                        },
                      ],
                  },
                  {
                    label: "Paragraphs (for text type)",
                    name: "paragraphs",
                    widget: "list",
                    required: false,
                    field:
                      { label: "Paragraph", name: "paragraph", widget: "text" },
                  },
                ],
            }

      - name: "uses"
        label: "Uses"
        file: "content/back-pages/uses.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Last Updated", name: "lastmod", widget: "date" }
          - {
              label: "Sections",
              name: "sections",
              widget: "list",
              fields:
                [
                  { label: "Title", name: "title", widget: "string" },
                  {
                    label: "Items",
                    name: "items",
                    widget: "list",
                    fields:
                      [
                        { label: "Title", name: "title", widget: "string" },
                        { label: "Description", name: "desc", widget: "string" },
                      ],
                  },
                ],
            }

      - name: "schedule"
        label: "Schedule"
        file: "content/schedule.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Google Calendar Email",
              name: "calendar_id",
              widget: "string",
            }
          - { label: "Timezone", name: "timezone", widget: "string" }
          - { label: "Best Times to Meet", name: "best_times", widget: "text" }
          - {
              label: "Contact Note (markdown supported)",
              name: "contact_note",
              widget: "text",
            }
          - {
              label: "Obfuscated Email",
              name: "email_obfuscated",
              widget: "string",
            }
          - { label: "Footer Note", name: "footer_note", widget: "text" }

      - name: "about"
        label: "About"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Tagline", name: "tagline", widget: "text" }
          - {
              label: "Social Links",
              name: "socials",
              widget: "list",
              fields:
                [
                  { label: "Label", name: "label", widget: "string" },
                  { label: "URL", name: "url", widget: "string" },
                ],
            }
          - { label: "Body", name: "body", widget: "markdown" }

      - name: "now"
        label: "Now"
        file: "content/now.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Last Modified", name: "lastmod", widget: "datetime" }
          - { label: "Body", name: "body", widget: "markdown" }
