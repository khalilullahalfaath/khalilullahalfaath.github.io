{{ define "main" }}
<article class="til-single">
  <header class="til-single-header">
    <h1>{{ .Title }}</h1>
    <div class="til-single-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ if .Params.tags }}
      <span class="separator">·</span>
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
      {{ end }}
    </div>
  </header>
  
  <div class="content">
    {{ .Content }}
  </div>
  
  <footer class="til-single-footer">
    <a href="/til" class="back-link">← Back to TIL</a>
  </footer>
</article>
{{ end }}
