{{ define "main" }}
<div class="about">
  <img src="{{ .Params.image }}" alt="{{ .Params.name }}" class="portrait">

  <h1>{{ .Params.name }}</h1>

  <p class="bio">
    {{ .Params.tagline }}
  </p>

  <div class="social-links">
    {{ range $i, $s := .Params.socials }}
    {{ if $i }}<span class="separator">·</span>{{ end }}
    <a href="{{ $s.url }}" target="_blank" rel="noopener">{{ $s.label }}</a>
    {{ end }}
  </div>

  <hr>

  <div class="content">
    {{ .Content }}
  </div>
</div>
{{ end }}
