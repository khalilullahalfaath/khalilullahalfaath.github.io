{{ define "main" }}
<div class="timeline-page">
  <h1>{{ .Title }}</h1>
  <p class="page-description">Key milestones in my academic and professional journey.</p>

  <div class="timeline">
    {{ range .Params.items }}
    <div class="timeline-item">
      <div class="timeline-marker"></div>
      <div class="timeline-content">
        <time class="timeline-date">{{ .date }}</time>
        <h3>{{ .title }}</h3>
        <p>{{ .description }}</p>
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
