{{ define "main" }}
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>

<style>
  /* Dark mode overrides for Pagefind UI */
  .dark .pagefind-ui {
    --pagefind-ui-primary: var(--accent);
    --pagefind-ui-text: var(--text);
    --pagefind-ui-background: var(--bg);
    --pagefind-ui-border: var(--border);
    --pagefind-ui-tag: var(--surface);
  }
  
  .dark .pagefind-ui__search-input {
    background-color: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  
  .dark .pagefind-ui__result {
    background-color: var(--surface);
    border: 1px solid var(--border);
  }
  
  .dark .pagefind-ui__result-link {
    color: var(--accent);
  }
  
  .dark .pagefind-ui__result-link:hover {
    color: var(--accent);
    opacity: 0.8;
  }
  
  .dark .pagefind-ui__message {
    color: var(--text-muted);
  }
  
  .dark .pagefind-ui mark {
    background-color: var(--accent);
    color: var(--bg);
  }
</style>

<div class="content-wrapper">
  <h1>Search</h1>
  <div id="search"></div>
</div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    new PagefindUI({ element: "#search", showSubResults: true });
  });
</script>
{{ end }}
