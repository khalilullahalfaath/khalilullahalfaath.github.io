{{ define "main" }}
<div class="nb-page">
  {{ partial "page-head.html" (dict "title" .Title
       "desc" (cond (eq .Kind "term") (printf "Every entry filed under %s." .Title) "")) }}
  {{ partial "notebook-index.html" (dict "pages" (where .Pages "Type" "!=" "page").ByDate.Reverse) }}
</div>
{{ end }}
