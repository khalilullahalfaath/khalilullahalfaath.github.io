{{ define "main" }}
<div class="content-wrapper">
  <h1>Categories</h1>
  <p class="page-description">Explore posts by topic</p>
  
  <div class="categories-grid">
    {{ range .Data.Terms.ByCount }}
    <a href="{{ .Page.Permalink }}" class="category-card">
      <div class="category-icon">📁</div>
      <h3 class="category-title">{{ .Page.Title }}</h3>
      <p class="category-count">{{ .Count }} {{ if eq .Count 1 }}post{{ else }}posts{{ end }}</p>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
