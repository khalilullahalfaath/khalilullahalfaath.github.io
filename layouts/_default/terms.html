{{ define "main" }}
<div class="content-wrapper">
  <h1>Categories</h1>
  
  <div class="category-list">
    {{ range $index, $term := .Data.Terms }}
    {{ if $index }}<span class="separator">·</span>{{ end }}
    <a href="{{ .Page.Permalink }}">{{ .Page.Title }} ({{ .Count }})</a>
    {{ end }}
  </div>
</div>
{{ end }}
