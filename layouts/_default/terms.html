{{ define "main" }}
<div class="nb-page">
  {{ partial "page-head.html" (dict "title" .Title "desc" "Every topic in the notebook, most used first.") }}
  <ul class="nb-termlist">
    {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a><span>{{ .Count }} {{ cond (eq .Count 1) "entry" "entries" }}</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
