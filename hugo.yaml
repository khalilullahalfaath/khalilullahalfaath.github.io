baseURL: "https://kafkuy.tech/"
languageCode: "en-us"
title: "Kafkuy"
enableGitInfo: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
        enable: true

params:
  description: "You can find anything here"
  dateFormat: "Jan 2, 2006"
  math: true
  mainSections: ["posts"]

sitemap:
  priority: 0.5
  changefreq: monthly
  filename: sitemap.xml

outputs:
  home: ["HTML", "RSS"]

